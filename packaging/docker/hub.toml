# DaemonSight hub settings. The container copies this file to
# /data/config.toml on its first start; edit that copy and restart the
# container. Every setting is in packaging/config.example.toml.

host_id = "hub"
data_dir = "/data"
# Log lines, kept in the data folder so they outlive the container.
log_file = "/data/daemonsight.log"

[retention]
# How long the hub keeps each host's history. 0 keeps it for good.
metrics_hours = 48            # chart points, about one a second per host
events_days = 0               # "Recent changes"
resolved_findings_days = 0    # findings that have cleared

[backup]
# A backup of the database, config and secrets in /data/backups.
interval_hours = 24           # 0 turns scheduled backups off
keep = 7

[web]
# All addresses inside the container. Publish the port to a LAN address
# only (docker run -p 192.168.1.20:8466:8466), never to the internet.
listen = "0.0.0.0"
port = 8466
password_file = "/data/password"
secret_file = "/data/secret"

# Your reverse proxy's address, so the login's rate limit and the upload
# log see each visitor's own address instead of the proxy's.
# trusted_proxies = ["192.168.1.1"]

# Set true once the hub is only reached over HTTPS.
# secure_cookies = true

[hub]
enabled = true

[cve]
# The hub downloads the Debian security tracker, EPSS scores, CISA's KEV
# list and SSVC ratings (outbound HTTPS) and matches every host's packages against them.
enabled = true
refresh_hours = 24
# epss_automatable = 0.04
