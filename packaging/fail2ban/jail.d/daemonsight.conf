# Bans addresses that keep failing the DaemonSight login.
# If the UI is behind Caddy, set web.trusted_proxies so the logged address is
# the client's, not Caddy's.
[daemonsight]
enabled  = true
backend  = systemd
filter   = daemonsight
port     = http,https,8466
maxretry = 5
findtime = 10m
bantime  = 1h
