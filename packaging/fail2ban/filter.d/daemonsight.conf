# Fail2Ban filter for the DaemonSight web login.
#
# daemonsight-web logs to the journal:
#   WARNING daemonsight.auth: Failed login from <host>
#   WARNING daemonsight.auth: Failed login from <host> (rate limited)
# and, on a hub, uploads with a bad token (other refused uploads, such as a
# collector sending a malformed upload, don't count):
#   WARNING daemonsight.auth: Refused upload from <host>: unknown token
#   WARNING daemonsight.auth: Refused upload from <host>: this token belongs to ...
#   WARNING daemonsight.auth: Refused upload from <host>: too many refused uploads; ...
#
# Test:
#   fail2ban-regex systemd-journal /etc/fail2ban/filter.d/daemonsight.conf

[INCLUDES]
before = common.conf

[Definition]
# The systemd backend presents entries as "<hostname> <identifier>[pid]: MESSAGE";
# %(__prefix_line)s from common.conf matches that prefix.
failregex = ^%(__prefix_line)sWARNING daemonsight\.auth: Failed login from <HOST>(?: \(rate limited\))?\s*$
            ^%(__prefix_line)sWARNING daemonsight\.auth: Refused upload from <HOST>: (?:unknown token|this token belongs to |too many refused uploads)
ignoreregex =
journalmatch = _SYSTEMD_UNIT=daemonsight-web.service
