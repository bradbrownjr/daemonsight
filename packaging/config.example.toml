# DaemonSight configuration. Every setting is optional; the values shown are
# the defaults.
#
# On a hub, [retention], [backup] (interval_hours, keep), [cve], [outside] and
# [remote] can also be changed on the Settings page (account menu, top right).
# A value set there wins over this file, applies without a restart, and can be
# reset to what this file says. This file is never rewritten. Everything else
# here, and every setting on a host that isn't a hub, is changed only in this
# file, followed by a restart.

# Name shown in the UI and stored with every record. Defaults to the hostname.
# host_id = "vps1"

# data_dir = "/var/lib/daemonsight"

# "server" (always on, the default) or "workstation" (a laptop or desktop that
# is often off or asleep). A workstation that stops uploading is "Offline" on
# the hub, a low finding, instead of a high "Not reporting". Any other value
# counts as "server". Must stay above the first [section].
# role = "server"

# Also write log lines to this file (rotated at 5 MB, four files kept). The
# journal has them already on a host; the hub container uses /data/daemonsight.log.
# log_file = ""

[web]
# Keep this on loopback or a WireGuard address, never a public one.
# listen = "127.0.0.1"
# port = 8466

# Proxies whose X-Forwarded-For is trusted, so logs and fail2ban see the real
# client address. Caddy on the same host is 127.0.0.1.
# trusted_proxies = ["127.0.0.1", "::1"]

# Set true when the UI is only reached over HTTPS.
# secure_cookies = false
# session_hours = 12
# password_file = "/etc/daemonsight/password"
# secret_file = "/etc/daemonsight/secret"

[collector]
# Seconds between reads.
# interval_system = 15
# interval_systemd = 30
# interval_ports = 60
# interval_docker = 30
# interval_caddy = 60
# interval_fail2ban = 60
# interval_firewall = 300
# Pending apt or dnf updates, reboots and services on old libraries (never runs apt update
# or dnf makecache).
# interval_packages = 3600
# docker_socket = "/var/run/docker.sock"
# Podman's rootful socket speaks the Docker API: "/run/podman/podman.sock" (untested).
# Caddy's admin address, written as Caddy writes it. A Unix socket is safer:
# set `admin unix//run/caddy/admin.sock` in the Caddyfile and use the same here.
# caddy_admin = "localhost:2019"
# fail2ban_socket = "/var/run/fail2ban/fail2ban.sock"
# nft = "nft"
# service_patterns = ["*.service"]
# Container log lines kept for the Logs view (secrets are masked).
# log_tail_lines = 100
# metrics_retention_hours = 48   # old name for [retention] metrics_hours; unset by default

[exposure]
# Ports meant to be reachable from the internet. Any other port listening on
# a public address is a finding.
# expected_public = ["22/tcp", "80/tcp", "443/tcp", "443/udp"]

# Ports a provider firewall in front of the host allows (a cloud firewall
# policy). Leave empty when there is none.
# upstream_allow = ["22/tcp", "80/tcp", "443/tcp"]

# Jails DaemonSight can't link to a service by name, journal match or log
# path. Jail name = list of systemd units it protects.
# [exposure.jail_covers]
# nginx-http-auth = ["nginx.service"]

# Web UIs to link from each source's (i) panel, keyed by source name:
# system, systemd, ports, docker, caddy, fail2ban, firewall.
# [links]
# caddy = "https://router.example.lan/ui/caddy/reverse_proxy"
# firewall = "https://cloud-panel.example.com/"

[thresholds]
# disk_percent = 90
# memory_percent = 90
# memory_minutes = 15

[retention]
# On a hub, also on the Settings page (it wins over this file).
# How long this install keeps history. On a host the collector prunes its
# own rows; on a hub the hub prunes every host's. 0 keeps it for good.
# metrics_hours = 48            # chart points, about one a second
# events_days = 0               # "Recent changes"
# resolved_findings_days = 0    # findings that have cleared (open ones stay)

[backup]
# On a hub, interval_hours and keep are also on the Settings page; dir never is.
# Scheduled backups (docs/INSTALL.md, "Back up and restore"): the database,
# this file, the password, the session secret and any upload token, in one
# owner-only .tar.gz. Made by the collector on a host and by the hub.
# dir = ""                      # default: <data_dir>/backups
# interval_hours = 24           # 0 turns them off; unset, a host that uploads to a hub skips them
# keep = 7

[cve]
# CVE matching, on the hub only (docs/INSTALL.md, "CVE matching"). Also on the
# Settings page, which wins over this file and needs no restart. The hub
# downloads the Debian security tracker, EPSS scores, CISA's KEV list and CISA's
# SSVC ratings (from each matched CVE's record at cveawg.mitre.org). Each finding's
# deadline comes from CISA BOD 26-04 (docs/DESIGN.md, "Prioritisation").
# enabled = true
# refresh_hours = 24
# Where CISA has not rated whether a CVE is automatable, DaemonSight estimates it:
# yes when the CVE's EPSS probability is at or above this. FIRST (first.org/epss/using-epss):
# "approximately the 90th percentile (>=0.04)" matches the effort of patching every CVSS
# Critical. Replaces the old epss_high, which an existing file may still use (read as this).
# epss_automatable = 0.04

[outside]
# Shodan's outside view, on the hub only (docs/INSTALL.md, "Outside checks"). Turn
# it on from the Settings page (account menu), or here: what the internet sees
# of each host's public addresses, from Shodan. Off by default.
# LICENCE: InternetDB (the default source) is free for non-commercial use only.
# Shodan: "If you're using the InternetDB API to make money then you need an
# enterprise license." It takes no key. For commercial use set source = "shodan"
# and use your own key on a Shodan API plan that lists Commercial Use (its
# pricing page: Freelancer, Small Business, Corporate; the API data must be
# attributed to Shodan). Check the terms before you turn this on.
# Only the IP address is sent; the Shodan API also gets your key.
# enabled = false
# Where the answers come from: "internetdb" (free, non-commercial, no key) or
# "shodan" (Shodan's REST API with your key: also each port's transport,
# product, version and last-seen time). The key is not set in this file: save
# it on the Settings page (Outside view, API key). It is written to a 0600
# file, shown never, and included in backups. To keep it somewhere else, point
# key_file at that file (one line, mode 0600).
# source = "internetdb"
# key_file = ""        # blank: shodan.key in the data folder
# Extra addresses to check, besides every host's own public addresses.
# "203.0.113.9" is checked for the host that reports it. "203.0.113.9=vps"
# attaches it to the host named vps, for an address no collector reports
# (a router's, say). Private addresses are refused.
# addresses = []
# Hours between checks of each address. InternetDB updates weekly; the Shodan
# API allows one request a second, and this makes one per address per check.
# refresh_hours = 24

[upload]
# Send everything this host collects to a hub (docs/INSTALL.md, "Run a hub").
# The hub's name for this host must match host_id at the top of this file.
# url = "https://upload.example.com/api/v1/ingest"
# token_file = "/etc/daemonsight/hub.token"   # written by: sudo daemonsight set-upload-token
# interval = 30
# Install updates the hub asks for: a commit on main or in a release tag,
# checked on this host before it's installed. The hub can't change this.
# remote_update = true

[hub]
# Only on the hub (the container sets this). Receives uploads from collectors.
# enabled = false
# max_upload_mb = 8       # largest upload as sent
# max_unpacked_mb = 48    # and once unpacked

[remote]
# Only on the hub. Reads systems that have no collector (Unraid) over their API.
# Add them in the web UI (Hosts, "Add a system"); this only switches reading on or off,
# and the Settings page can too.
# enabled = true
