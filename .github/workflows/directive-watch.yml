# Weekly check that CISA has not replaced the directive the prioritisation table comes from (docs/DESIGN.md, "When the directive
# changes"). It opens an issue when the directive's page says it was revoked or superseded, or the table image changed. A page that
# cannot be fetched fails the run instead, so it shows in Actions. The check logic is scripts/check_directive.py.
name: Directive watch

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: directive-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the directive page and the table image
        id: check
        continue-on-error: true
        run: python3 scripts/check_directive.py --body-file "$RUNNER_TEMP/directive-change.md"
      - name: Open an issue when something changed
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.check.outputs.title }}
        run: |
          open="$(gh issue list --state open --limit 200 --json title --jq '[.[] | select(.title == env.TITLE)] | length')"
          if [ "$open" != "0" ]; then
            echo "An issue titled \"$TITLE\" is already open; not opening another."
            exit 0
          fi
          gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/directive-change.md"
      - name: Fail the run when a page could not be fetched
        if: steps.check.outcome == 'failure'
        run: |
          echo "The check could not fetch a page; see the step above."
          exit 1
