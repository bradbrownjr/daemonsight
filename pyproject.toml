[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "daemonsight"
version = "0.1.0"
description = "Self-hosted security dashboard for your whole stack: Linux servers, containers, Unraid and OPNsense. What is exposed, which CVEs matter, and how to fix them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163,<1",
    "uvicorn>=0.54,<1",
    "jinja2>=3.1,<4",
    "psutil>=7.2,<8",
    "dbus-fast>=5.2,<6",
    "httpx>=0.28,<1",
    "websockets>=17.4,<18",
    "argon2-cffi>=25.1,<26",
    "itsdangerous>=2.2,<3",
    "python-multipart>=0.0.34,<1",
    "pydantic>=2.14,<3",
    "tzdata>=2024.1",     # the time zone database for the digest schedule, where the system has none (slim containers)
]

[project.optional-dependencies]
dev = ["pytest>=9.2,<10", "pytest-asyncio>=1.5,<2"]
screenshots = ["playwright>=1.50,<2", "pillow>=11,<14", "pytest>=9.2,<10"]  # pytest: the script imports test fakes

[project.scripts]
daemonsight = "daemonsight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"daemonsight.web" = ["templates/*.html", "templates/partials/*.html", "static/*", "static/vendor/*"]
"daemonsight.data" = ["distro-info/*", "fedora/*", "endoflife/*", "priority/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
