[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "daemonsight"
version = "0.1.0"
description = "One view of what a Linux server exposes, what is watching it, and what is out of date."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163,<1",
    "uvicorn>=0.54,<1",
    "jinja2>=3.1,<4",
    "psutil>=7.2,<8",
    "dbus-fast>=5.2,<6",
    "httpx>=0.28,<1",
    "argon2-cffi>=25.1,<26",
    "itsdangerous>=2.2,<3",
    "python-multipart>=0.0.34,<1",
    "pydantic>=2.14,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9.2,<10", "pytest-asyncio>=1.5,<2"]

[project.scripts]
daemonsight = "daemonsight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"daemonsight.web" = ["templates/*.html", "templates/partials/*.html", "static/*", "static/vendor/*"]
"daemonsight.data" = ["distro-info/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
